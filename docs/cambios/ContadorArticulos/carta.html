<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Fondo con degradado */
        body { 
            background-image: url('images/fondo2.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Helvetica;
        }
        
        /* Contenedor fijo para las banderas de idiomas */
        .idiomas-container { 
            position: fixed; 
            top: 30px; 
            right: 30px; 
        }
        
        /* Botones de idiomas transparentes */
        .btn-flag { 
            background: transparent; 
            border-radius: 10px;   
        }
        
        /* Título principal alineado a la izquierda */
        .main-title { 
            color: #ffffff;
            font-size: 9rem; 
            font-weight: bold; 
            text-align: left; 
            margin: 60px;
            text-shadow: 10px 10px 5px rgba(0, 0, 0, 0.8);
        }
        
        /* Tarjetas que agrupan cada categoría de comida */
        .categoria-seccion { 
            border-radius: 50px; 
            margin-bottom: 60px;  
            overflow: hidden;  /* para que no salgan los picos */
            margin: 20px;
        }

        /* Cabecera negra de cada categoría */
        .categoria-header {
            background: #000; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        
        /* Icono de la categoría */
        .img-categoria { 
            width: 200px; 
            height: 200px; 
        }

        /* Título de la categoría */
        .categoria-titulo { 
            font-size: 3rem; 
            font-weight: bold; 
            color: #ffffff; 
        }

        /* Cuadrícula para los platos */
        .platos-grid { 
            padding: 80px;
            background: #1a1a1a; 
            display: grid; 
            gap: 20px; 
        }

        /* Tarjeta individual de cada plato */
        .plato-card { 
            background: #2d2d2d; 
            display: flex; 
            align-items: center; 
            padding: 20px; 
            border-radius: 20px;
        }

        /* Efecto al pasar el ratón por encima del plato */
        .plato-card:hover { 
            box-shadow: 0 15px 30px #bababa;
            background: #545454; 
        }
        
        /* Imagen del plato */
        .img-producto { 
            width: auto; 
            height: 80px; 
            border-radius: 20px;
        }

        /* Nombre del plato */
        .plato-nombre { 
            font-weight: bold; 
            color: #acacac; 
            font-size: 1.2rem;
            text-align: center;
            width: 100%; 
        }

        /* Clase para ocultar platos con JavaScript */
        .oculto {
            display: none;
        }

        /* Contenedor de los botones de filtrado alineado a la izquierda */
        .filtros-container {
            display: flex;
            gap: 20px;
            margin: 40px;
        }

        /* Botón de filtro por defecto */
        .btn-filtro {
            background: #000000;
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 20px;
            font-weight: bold;
        }

        .btn-filtro:hover {
            background: #4e4e4e;
        }

        /* Contenedor del carrito */
        #zona-pedidos { 
            padding: 20px; 
            background: #000000; 
            position: sticky; /* para que baje al hacer scroll */
            top: 75px; 
        }

        /* Botón de restar unidad (-) */
        .btn-restar { 
            color: #ffffff;
            border: none;
            border-radius: 20px;
            margin: 10px;
        }

        .btn-restar:hover {
            background: #c82333;
        }
        
        /* Botón rojo de vaciar carrito */
        .btn-vaciar {
            width: 100%;
            background: #dc3545;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .btn-vaciar:hover {
            background: #c82333;
        }

        .cabecera-tabla {
            color: #888;
        }

        .nombre-pedido {
            font-weight: bold; 
            color: #ccc;
        }

        .cantidad-pedido {
            font-size: 1.2rem;
        }

        .contador {
            color:#fff;
        }

    </style>
    <title>Auto-Gourmet</title>
</head>
<body>
    <!-- contenedor de las banderas para los idiomas -->
    <div class="idiomas-container">
        <button id="btn-es" class="btn-flag">🇪🇸</button>
        <button id="btn-en" class="btn-flag">🇬🇧</button>
        <button id="btn-fr" class="btn-flag">🇫🇷</button>
        <button id="btn-de" class="btn-flag">🇩🇪</button>
    </div>

    <!--Contenedor principal de toda la pagina-->
    <div class="container-fluid">
        <header>
            <h1 class="main-title">AUTO-GOURMET</h1>
        </header>

        <div class="filtros-container">
            <button id="btn-alcohol" class="btn-filtro"></button>
            <button id="btn-especialidades" class="btn-filtro"></button>
        </div>

        <div class="row">
            
            <div class="col-lg-8">
                <div id="contenedor-menu"></div>
            </div>

            <div class="col-lg-4">
                <div id="zona-pedidos" class="categoria-seccion">
                    <h2 id="titulo-pedidos" class="categoria-titulo text-center">PEDIDO</h2>
                    <div>
                        <table id="tabla-pedidos" class="table table-dark">
                        </table>
                        
                        <h3 id="contador-articulos" class="contador">0</h3>
                        
                        <button id="btn-vaciar" class="btn-vaciar"></button>
                    </div>
                </div>
            </div>

        </div> 
    </div>
    
    <script src="carta.js"></script>
</body>
</html>
