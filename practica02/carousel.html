<!doctype html>
<html lang="es-ES">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <title>Practica 2.8. Carousel</title>
</head>
<body>
    <div class="container">
        <div id="carrusel01" class="carousel slide" data-bs-ride="carousel">
            
            <!-- Indicators -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carrusel01" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#carrusel01" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#carrusel01" data-bs-slide-to="2"></button>
                <button type="button" data-bs-target="#carrusel01" data-bs-slide-to="3"></button>
                <button type="button" data-bs-target="#carrusel01" data-bs-slide-to="4"></button>
            </div>

            <!-- Fotos -->
            <div class="carousel-inner">
                
                <div class="carousel-item active">
                    <img src="images/1.jpeg" alt="Coche de Fernando Alonso" class="d-block w-100">
                    <div class="carousel-caption">
                        <h3>El mejor coche de Fernando Alonso</h3>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="images/2.jpeg" alt="Visitando Gijon" class="d-block w-100">
                    <div class="carousel-caption">
                        <h3>Visitando Gijon</h3>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="images/3.jpeg" alt="Dia 3 del viaje en Asturias" class="d-block w-100">
                    <div class="carousel-caption">
                        <h3>Dia 3 del viaje en Asturias</h3>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="images/4.jpeg" alt="Con mi hermano por el puerto" class="d-block w-100">
                    <div class="carousel-caption">
                        <h3>Con mi hermano dando una vuelta por el puerto</h3>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="images/5.jpeg" alt="Tomando una sidra" class="d-block w-100">
                    <div class="carousel-caption">
                        <h3>Tomando una sidra antes del cachopo</h3>
                    </div>
                </div>

            </div>

            <!-- Botones izquierda y derecha -->
            <button class="carousel-control-prev" type="button" data-bs-target="#carrusel01" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carrusel01" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </div>
</body>
</html>
