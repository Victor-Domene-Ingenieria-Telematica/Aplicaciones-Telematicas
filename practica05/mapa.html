<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 5.1. Geolocalización y mapas</title>
    
    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.2.0/dist/leaflet.css" />
    
    <style>
        #id_mapa {
            height: 400px;
        }
    </style>
</head>
<body>

    <h2>Mi posición actual</h2>
    
    <!-- El div donde irá el mapa -->
    <div id="id_mapa"></div>
    <p id="mensaje">Buscando tu ubicación...</p>

    <!-- JS de Leaflet-->
    <script src="https://unpkg.com/leaflet@1.2.0/dist/leaflet.js"></script>
    
    <script>
        'use strict';

        const mensaje = document.getElementById('mensaje');

        // Pedimos la ubicación al navegador (aunque al ser un PC no sale la ubicacion buena)
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(mostrarMapa, errorMapa);
        } else {
            mensaje.innerHTML = "Tu navegador no soporta la geolocalización";
        }

        // Si el usuario da permiso:
        function mostrarMapa(posicion) {
            mensaje.innerHTML = ""; // Borramos el texto de "Buscando..."

            // Guardamos las coordenadas en variables como en los apuntes
            let latitud = posicion.coords.latitude;
            let longitud = posicion.coords.longitude;
            let zoom = 16;

            // Creamos el objeto de tipo L.map()
            let mi_mapa = L.map('id_mapa').setView([latitud, longitud], zoom);

            // Invocamos el método L.tileLayer()
            L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a>'
            }).addTo(mi_mapa);

            // Añadimos marcadores y mensajes
            let mi_marcador = L.marker([latitud, longitud]).addTo(mi_mapa);
            mi_marcador.bindPopup("¡Estás aquí!").openPopup();
        }

        // Si el usuario bloquea el permiso o falla
        function errorMapa() {
            mensaje.innerHTML = "Hubo un error. Asegúrate de dar permisos de ubicación al navegador";
            mensaje.style.color = "red";
        }
    </script>
</body>
</html>
