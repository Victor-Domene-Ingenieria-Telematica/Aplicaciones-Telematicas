<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 5.2. ¿Dónde está mi coche?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.2.0/dist/leaflet.css" />
    <style>
        #id_mapa {
            height: 400px;
            width: 100%;
            border-radius: 8px;
            border: 2px solid #ccc;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4 text-primary">¿Dónde está mi coche?</h2>
        
        <!-- Botones de acción -->
        <div class="d-flex gap-3 mb-3">
            <!-- Botón Recordar -->
            <button id="btn-recordar" class="btn btn-success fw-bold" disabled>Recordar posición</button>
            
            <!-- Botón Borrar -->
            <button id="btn-borrar" class="btn btn-danger fw-bold" disabled>Borrar posición</button>
        </div>

        <!-- El div donde irá el mapa -->
        <div id="id_mapa" class="shadow-sm"></div>
        <p id="mensaje" class="mt-3 text-muted fw-bold">Buscando tu ubicación...</p>
    </div>

    <!-- JS de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.2.0/dist/leaflet.js"></script>
    <script src="dondeEsta.js"></script>
</body>
</html>
